<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elite Trainers Academy — Application</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --primary:#111827;
      --accent:#d1a44b;   /* gold */
      --navy:#20314f;     /* navy */
      --bg1:#0f172a;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:"Montserrat",sans-serif;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      background:
        radial-gradient(1200px 600px at 15% 10%, rgba(209,164,75,.22), transparent 60%),
        radial-gradient(900px 600px at 90% 20%, rgba(32,49,79,.22), transparent 55%),
        linear-gradient(145deg, var(--bg1), #020617);
      color:#0b1220;
    }

    .wrap{width:min(760px,100%);display:grid;gap:14px}
    .card{
      background:rgba(255,255,255,0.93);
      border:1px solid rgba(255,255,255,0.35);
      border-radius:20px;
      padding:28px;
      box-shadow:0 18px 55px rgba(0,0,0,0.35);
      backdrop-filter: blur(10px);
    }

    .top{display:flex;align-items:center;gap:16px;margin-bottom:10px}
    .logo{
      width:76px;height:76px;border-radius:16px;
      object-fit:contain;background:rgba(0,0,0,0.04);
      padding:10px;border:1px solid rgba(0,0,0,0.06);
    }

    h1{font-size:22px;line-height:1.2;color:var(--navy)}
    .sub{margin-top:6px;font-size:13px;line-height:1.5;color:#334155}

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
      margin-top:16px;
    }

    label{
      display:block;
      font-size:13px;
      font-weight:700;
      color:#0f172a;
      margin:8px 0 6px;
    }

    input,select,textarea{
      width:100%;
      padding:13px 14px;
      border-radius:12px;
      border:1px solid rgba(15,23,42,0.18);
      background:rgba(255,255,255,0.97);
      font-size:15px;
      outline:none;
      transition:.18s ease;
    }

    textarea{min-height:110px;resize:vertical}
    input:focus,select:focus,textarea:focus{
      border-color: rgba(209,164,75,0.9);
      box-shadow: 0 0 0 4px rgba(209,164,75,0.18);
    }

    .full{grid-column:1/-1}

    .error{
      display:none;
      margin-top:12px;
      padding:10px 12px;
      border-radius:12px;
      background:rgba(239,68,68,0.10);
      border:1px solid rgba(239,68,68,0.25);
      color:#7f1d1d;
      font-size:13px;
      line-height:1.45;
    }

    .btn{
      margin-top:14px;
      width:100%;
      padding:14px 16px;
      border-radius:14px;
      border:none;
      background: linear-gradient(135deg, var(--accent), #f6c56b);
      color:#0b1220;
      font-weight:800;
      font-size:16px;
      cursor:pointer;
      box-shadow:0 12px 30px rgba(209,164,75,0.22);
      transition:transform .18s ease, filter .18s ease;
    }
    .btn:hover{transform:translateY(-2px);filter:brightness(1.02)}
    .btn:disabled{opacity:.65;cursor:not-allowed;transform:none}

    .thank{
      display:none;
      margin-top:10px;
      padding:14px 14px;
      border-radius:14px;
      background:rgba(34,197,94,0.10);
      border:1px solid rgba(34,197,94,0.25);
      color:#14532d;
      font-weight:800;
      line-height:1.6;
      text-align:center;
    }

    .footer{
      text-align:center;
      color:rgba(255,255,255,0.78);
      font-size:12px;
      line-height:1.5;
      padding:0 10px;
    }

    @media (max-width:720px){
      .grid{grid-template-columns:1fr}
      .logo{width:68px;height:68px}
      .card{padding:20px}
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <div class="top">
        <img class="logo" src="elite-trainers-academy.png" alt="Elite Trainers Academy Logo">
        <div>
          <h1>Elite Trainers Academy</h1>
          <div class="sub">Fill this application to be contacted by our team. Serious requests only.</div>
        </div>
      </div>

      <div class="error" id="errorBox"></div>

      <form id="form">
        <div class="grid">
          <div>
            <label for="nom">Full name *</label>
            <input id="nom" name="nom" type="text" required placeholder="Your name">
          </div>

          <div>
            <label for="whatsapp">WhatsApp number *</label>
            <input id="whatsapp" name="whatsapp" type="tel" required placeholder="+213xxxxxxxxx">
          </div>

          <div>
            <label for="email">Email *</label>
            <input id="email" name="email" type="email" required placeholder="you@email.com">
          </div>

          <div>
            <label for="niveau">Level</label>
            <select id="niveau" name="niveau">
              <option value="" selected>Choose</option>
              <option>Beginner</option>
              <option>Intermediate</option>
              <option>Advanced</option>
              <option>Professional</option>
            </select>
          </div>

          <div class="full">
            <label for="objectif">Main goal *</label>
            <select id="objectif" name="objectif" required>
              <option value="" selected disabled>Choose</option>
              <option>Personal coaching</option>
              <option>Become a trainer</option>
              <option>Join an academy program</option>
              <option>Nutrition plan</option>
              <option>Other</option>
            </select>
          </div>

          <div class="full">
            <label for="message">Tell us about your objective *</label>
            <textarea id="message" name="message" required placeholder="Explain what you want to achieve..."></textarea>
          </div>

          <!-- ✅ Tracking hidden fields -->
          <input type="hidden" name="landing_url" id="landing_url">
          <input type="hidden" name="referrer" id="referrer">
          <input type="hidden" name="traffic_source" id="traffic_source">

          <input type="hidden" name="utm_source" id="utm_source">
          <input type="hidden" name="utm_medium" id="utm_medium">
          <input type="hidden" name="utm_campaign" id="utm_campaign">
          <input type="hidden" name="utm_content" id="utm_content">
          <input type="hidden" name="utm_term" id="utm_term">
          <input type="hidden" name="utm_id" id="utm_id">
          <input type="hidden" name="fbclid" id="fbclid">

          <div class="full">
            <button class="btn" id="submitBtn" type="submit">Submit Application</button>
          </div>
        </div>
      </form>

      <div class="thank" id="thankYou">
        ✅ Application received successfully.<br/>
        We will contact you shortly.
      </div>
    </div>

    <div class="footer">
      © Elite Trainers Academy — This form is for applications only.
    </div>
  </div>

  <script>
    const form = document.getElementById("form");
    const thankYou = document.getElementById("thankYou");
    const errorBox = document.getElementById("errorBox");
    const submitBtn = document.getElementById("submitBtn");

    // ✅ PUT YOUR CURRENT /exec URL HERE (the one from your deployment)
    const scriptURL = "https://script.google.com/macros/s/AKfycbxUVtHd5iUJXn72xerrs_NmyhYBw4X4Q_UCfQ8oSw0Hf_k6mpzQdvxeQ3en49DcVbFhmg/exec";

    function showError(msg){
      errorBox.textContent = msg;
      errorBox.style.display = "block";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // ✅ Auto-capture tracking
    (function fillTracking(){
      const qs = new URLSearchParams(window.location.search);
      const setVal = (id, val) => {
        const el = document.getElementById(id);
        if (el) el.value = val || "";
      };

      setVal("landing_url", window.location.href);
      setVal("referrer", document.referrer || "");

      let source = "direct";
      if (document.referrer) source = "referral";
      if (qs.get("fbclid")) source = "facebook";

      const us = (qs.get("utm_source") || "").toLowerCase();
      if (us.includes("google")) source = "google";
      if (us.includes("tiktok")) source = "tiktok";
      if (us.includes("instagram")) source = "instagram";

      setVal("traffic_source", source);

      setVal("utm_source", qs.get("utm_source"));
      setVal("utm_medium", qs.get("utm_medium"));
      setVal("utm_campaign", qs.get("utm_campaign"));
      setVal("utm_content", qs.get("utm_content"));
      setVal("utm_term", qs.get("utm_term"));
      setVal("utm_id", qs.get("utm_id"));
      setVal("fbclid", qs.get("fbclid"));
    })();

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.style.display = "none";

      submitBtn.disabled = true;
      submitBtn.textContent = "Sending...";

      try {
        const formData = new FormData(form);

        // ✅ IMPORTANT: no-cors makes GitHub Pages -> Apps Script work reliably
        await fetch(scriptURL, {
          method: "POST",
          body: formData,
          mode: "no-cors"
        });

        form.style.display = "none";
        thankYou.style.display = "block";

      } catch (err) {
        console.error(err);
        showError("Submission failed. Please try again.");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Submit Application";
      }
    });
  </script>
</body>
</html>
